<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05080d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>SOLOSAKA</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="stage"></div>
  <div id="touch-layer"></div>
  <div id="topbar">
    <button id="btn-slow" type="button">SLOW</button>
    <button id="btn-full" type="button">⛶</button>
  </div>
  <div id="start">
    <div class="logo">SOLOSAKA</div>
    <div class="sub">STEP 1 — フィールド / 移動 / カメラ</div>
    <div class="tap">タップしてスタート</div>
    <div class="hint">スマホ：左側スライドで移動・右下 DASH ／ パッド：左スティック・R1 ダッシュ・R2 コントロール</div>
  </div>
  <div id="rotate">端末を横向きにしてください</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
