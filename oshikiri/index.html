<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1220">
<meta name="mobile-web-app-capable" content="yes">
<title>オシキリビースト</title>
<style>
:root{
  --bg:#0d1220;
  --panel:#161d30;
  --panel2:#1e2740;
  --line:#2c3758;
  --text:#e8ecf7;
  --sub:#93a0c2;
  --p:#3fa9ff;        /* プレイヤー側の色 */
  --p-dark:#1b4f80;
  --c:#ff5a5a;        /* CPU側の色 */
  --c-dark:#7a2430;
  --heat:#ff9a2e;     /* 熱 */
  --carry:#c6f04a;    /* 持ち越し・ボーナス熱 */
  --gold:#ffd447;
  --numb:#c07aff;     /* しびれ */
  --down:#5ab4ff;     /* 攻撃ダウン表示 */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden}
body{
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:13px;line-height:1.3;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}

/* ===== 全体レイアウト ===== */
#app{
  height:100vh;height:100dvh;max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;gap:6px;
  padding:calc(6px + env(safe-area-inset-top)) 8px calc(6px + env(safe-area-inset-bottom));
}
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:6px 10px;min-height:38px;font-size:12px;flex:none;
}
.bar .who{font-weight:700;font-size:13px}
.bar.opp .who{color:var(--c)}
.bar.me .who{color:var(--p)}
.bar .stat{color:var(--sub);white-space:nowrap}
.bar .stat b{color:var(--text);font-size:14px}
.bar.active.opp{box-shadow:0 0 0 2px var(--c) inset}
.bar.active.me{box-shadow:0 0 0 2px var(--p) inset}
.heatnum b{color:var(--heat)}
.heatnum .cx{color:var(--carry);font-weight:700;font-size:13px}
.pips{display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px}
.pip{width:7px;height:12px;border-radius:2px;background:#323b55}
.pip.on{background:var(--heat)}
.pip.cx{background:#3c4a25}
.pip.cx.on{background:var(--carry)}

/* ===== レーン ===== */
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:1 1 0;min-height:92px}
.cell{
  position:relative;border-radius:12px;border:1px dashed var(--line);
  background:rgba(255,255,255,.02);
  display:flex;align-items:stretch;justify-content:stretch;min-height:44px;
  transition:box-shadow .15s;
}
.cell .empty{margin:auto;color:#4b5678;font-size:12px}
.cell.can{border:2px solid var(--gold);background:rgba(255,212,71,.08);animation:glow 1s ease-in-out infinite alternate}
.cell.can .empty{color:var(--gold);font-weight:700}
.cell.can-move{border:2px solid var(--carry);background:rgba(198,240,74,.08);animation:glowm 1s ease-in-out infinite alternate}
.cell.can-move .empty{color:var(--carry);font-weight:700}
.cell.active{box-shadow:0 0 0 3px #fff,0 0 18px 4px rgba(255,255,255,.55)}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(255,212,71,.2)}to{box-shadow:0 0 14px 2px rgba(255,212,71,.55)}}
@keyframes glowm{from{box-shadow:0 0 0 0 rgba(198,240,74,.2)}to{box-shadow:0 0 14px 2px rgba(198,240,74,.55)}}

.unit{
  flex:1;border-radius:11px;padding:6px 6px 5px;
  display:flex;flex-direction:column;justify-content:space-between;align-items:center;
  background:linear-gradient(160deg,var(--uc) -40%,var(--panel2) 55%);
  border:2px solid var(--side);position:relative;overflow:hidden;
}
.unit.side-p{--side:var(--p)}
.unit.side-c{--side:var(--c)}
.unit.msel{border-color:var(--carry);box-shadow:0 0 12px rgba(198,240,74,.7)}
.unit .u-name{font-weight:700;font-size:13px;text-align:center;line-height:1.15;word-break:keep-all}
.unit .u-cost{position:absolute;top:3px;left:4px;font-size:12px;color:var(--heat);font-weight:700}
.unit .u-fs{position:absolute;top:2px;right:4px;font-size:12px}
.unit .u-stats{display:flex;gap:10px;font-size:20px;font-weight:800;line-height:1}
.unit .atk{color:#ffb35c}
.unit .atk.down{color:var(--down)}
.unit .hp{color:#7dffa8}
.unit .hp.dmg{color:#ff8a8a}
.unit .hp.hit{animation:hit .6s steps(2) 0s 1}
.unit .lbl{font-size:12px;color:var(--sub)}
.unit .tags{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
@keyframes hit{0%,100%{color:#ff2a2a;transform:scale(1.25)}50%{color:#fff;transform:scale(1)}}
.unit.sick{filter:saturate(.55) brightness(.85)}
.unit .u-sick{
  font-size:12px;font-weight:700;color:#1a1300;background:var(--gold);
  border-radius:8px;padding:1px 8px;
}
.unit .u-sick.go{background:#9af0ff}
.unit .u-numb{
  font-size:12px;font-weight:700;color:#fff;background:var(--numb);
  border-radius:8px;padding:1px 8px;
}
.unit.dying{animation:die .38s ease-in forwards}
@keyframes die{to{transform:scale(.1) rotate(25deg);opacity:0}}
.unit.placed{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:.2}to{transform:scale(1);opacity:1}}

/* 効果ポップアップ(0.8秒) */
.popup{
  position:absolute;left:50%;top:6px;z-index:5;max-width:112%;width:max-content;
  background:#fff;color:#14182a;font-weight:800;font-size:12px;line-height:1.2;text-align:center;
  padding:4px 7px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.55);
  pointer-events:none;animation:popup .8s ease-out forwards;
}
@keyframes popup{
  0%{opacity:0;transform:translate(-50%,8px) scale(.8)}
  15%{opacity:1;transform:translate(-50%,0) scale(1.06)}
  75%{opacity:1;transform:translate(-50%,-4px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-14px) scale(1)}
}

/* ===== おしあいゲージ ===== */
.gauge{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px 8px}
.g-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:5px}
.g-top .l{color:var(--c);font-weight:700}
.g-top .r{color:var(--p);font-weight:700}
.g-top .turn{font-weight:700;font-size:13px}
.g-top .turn.p{color:var(--p)}
.g-top .turn.c{color:var(--c)}
.g-track{
  position:relative;height:22px;border-radius:11px;overflow:visible;
  background:linear-gradient(90deg,var(--c-dark) 0%,#2a2f42 50%,var(--p-dark) 100%);
}
.g-tick{position:absolute;top:4px;bottom:4px;width:1px;background:rgba(255,255,255,.18)}
.g-tick.mid{top:0;bottom:0;width:2px;background:rgba(255,255,255,.7)}
.g-fill{position:absolute;top:5px;bottom:5px;border-radius:6px}
.g-fill.p{background:var(--p)}
.g-fill.c{background:var(--c)}
.g-marker{
  position:absolute;top:-6px;width:34px;height:34px;margin-left:-17px;border-radius:50%;
  background:#fff;color:#111;font-weight:900;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.6);border:3px solid #888;
}
.g-marker.p{border-color:var(--p)}
.g-marker.c{border-color:var(--c)}

/* ===== 手札 ===== */
.hand-wrap{flex:none;position:relative}
.hand-note{font-size:12px;color:var(--sub);margin:0 2px 3px;display:flex;justify-content:space-between;gap:6px}
.hand-note.warn{color:var(--gold);font-weight:700}
.hand-note .mv{color:var(--carry);font-weight:700}
.hand-note .ng{color:#ff8a8a;font-weight:700}
.hand{
  display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:6px 2px 6px;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scrollbar-width:none;
}
.hand::-webkit-scrollbar{display:none}
.hand .empty-hand{color:#4b5678;font-size:12px;padding:40px 8px}
.card{
  flex:none;width:98px;min-height:138px;border-radius:10px;padding:5px 6px 6px;
  background:linear-gradient(170deg,var(--uc) -30%,var(--panel2) 45%);
  border:2px solid #3b4668;position:relative;text-align:left;scroll-snap-align:start;
  display:flex;flex-direction:column;gap:3px;transition:transform .12s,border-color .12s;
}
.card .c-head{display:flex;align-items:center;gap:4px}
.card .c-cost{
  flex:none;width:22px;height:22px;border-radius:50%;background:var(--heat);color:#1a0e00;
  font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;
}
.card .c-name{font-weight:700;font-size:12px;line-height:1.1;word-break:keep-all}
.card .c-stats{display:flex;justify-content:space-around;font-weight:800;font-size:16px}
.card .c-stats .atk{color:#ffb35c}
.card .c-stats .hp{color:#7dffa8}
.card .c-text{font-size:12px;color:#c3cbe3;line-height:1.25;flex:1;background:rgba(0,0,0,.25);border-radius:6px;padding:3px 4px}
.card.poor{filter:brightness(.45) grayscale(.5)}
.card.sel{border-color:var(--gold);transform:translateY(-5px);box-shadow:0 0 12px rgba(255,212,71,.6)}
.card.dsel{border-color:var(--c);transform:translateY(-5px);box-shadow:0 0 12px rgba(255,90,90,.7)}
.card.mini{width:76px;min-height:110px}
.card.mini .c-text{display:none}

/* ===== 操作 ===== */
.controls{flex:none;display:flex;gap:8px}
.btn{
  flex:1;min-height:48px;border-radius:12px;font-weight:800;font-size:16px;
  background:linear-gradient(180deg,#3fa9ff,#1f6fc0);color:#fff;
  box-shadow:0 3px 0 #0f3d6b;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0f3d6b}
.btn:disabled{background:#2e3650;color:#6e7896;box-shadow:none}
.btn.danger{background:linear-gradient(180deg,#ff6a6a,#c03030);box-shadow:0 3px 0 #6b1414}
.btn.sub{background:#2e3650;box-shadow:0 3px 0 #161b2a}

/* ===== ログ ===== */
.log{
  flex:none;background:#0a0e19;border:1px solid var(--line);border-radius:10px;
  padding:5px 8px;height:calc(5 * 16px + 12px);overflow:hidden;font-size:12px;line-height:16px;
}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
.log div.p{color:#9fd2ff}
.log div.c{color:#ffadad}
.log div.sys{color:var(--gold)}
.log div.fx{color:#d7b6ff}
.log div:last-child{font-weight:700}

/* ===== モーダル ===== */
.modal-bg{
  position:fixed;inset:0;background:rgba(5,8,15,.78);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:16px;
  animation:fade .25s ease-out both;
}
.modal-bg.late{animation-delay:.6s}
.modal-bg.top{z-index:70}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:18px 16px;text-align:center;
}
.modal h1{font-size:22px;margin-bottom:6px}
.modal h2{font-size:28px;margin:4px 0 8px}
.modal p{color:var(--sub);font-size:13px;margin-bottom:10px}
.modal .order{font-size:18px;font-weight:800;margin:6px 0 10px}
.modal .order.p{color:var(--p)}
.modal .order.c{color:var(--c)}
.modal .mini-hand{display:flex;gap:4px;justify-content:center;margin:8px 0 14px}
.modal .btns{display:flex;gap:8px}
.win{color:var(--p)}
.lose{color:var(--c)}
.draw{color:var(--gold)}

/* カード詳細 */
.detail{
  text-align:left;border:2px solid var(--uc);
  background:linear-gradient(170deg,var(--uc) -60%,var(--panel) 45%);
}
.detail .d-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.detail .d-head .c-cost{
  width:32px;height:32px;border-radius:50%;background:var(--heat);color:#1a0e00;
  font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none;
}
.detail .d-name{font-size:20px;font-weight:800}
.detail .d-owner{font-size:12px;color:var(--sub)}
.detail .d-stats{display:flex;gap:16px;font-size:18px;font-weight:800;margin-bottom:6px}
.detail .d-stats .atk{color:#ffb35c}
.detail .d-stats .atk.down{color:var(--down)}
.detail .d-stats .hp{color:#7dffa8}
.detail .d-stats small{font-size:12px;color:var(--sub);font-weight:400}
.detail .d-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.detail .d-tag{font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;background:#2e3650}
.detail .d-tag.numb{background:var(--numb)}
.detail .d-tag.sick{background:var(--gold);color:#1a1300}
.detail .d-text{font-size:14px;line-height:1.5;background:rgba(0,0,0,.3);border-radius:10px;padding:10px;margin-bottom:14px}
.detail .d-flavor{font-size:12px;color:var(--sub);margin:-8px 0 12px}

/* ===== トースト ===== */
#toast{
  position:fixed;left:50%;bottom:30%;transform:translateX(-50%);z-index:80;
  background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;
  pointer-events:none;opacity:0;transition:opacity .2s;max-width:90%;text-align:center;
}
#toast.show{opacity:1}

/* ===== 横向き警告 ===== */
#rotate{
  display:none;position:fixed;inset:0;z-index:100;background:var(--bg);
  align-items:center;justify-content:center;font-size:18px;font-weight:700;text-align:center;padding:20px;
}
@media (orientation:landscape) and (max-height:600px){
  #rotate{display:flex}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="rotate">📱 縦向きにしてください</div>

<script>
'use strict';

/* =========================================================
   定数
   ========================================================= */
const GAUGE_MAX        = 8;   // おしあいゲージ上限(±8で決着)
const TURNS_PER_PLAYER = 8;   // 各プレイヤーのターン数
const HEAT_CAP         = 7;   // 熱の最大値の上限
const HEAT_START       = 2;   // 自分の1ターン目の熱の最大値
const CARRY_MAX        = 2;   // 熱の持ち越し上限
const HAND_MAX         = 6;   // 手札上限
const DECK_SIZE        = 20;  // デッキ枚数
const START_HAND       = 4;   // 初期手札
const SECOND_BONUS     = 1;   // 後攻1ターン目の熱ボーナス
const LANE_COUNT       = 3;   // レーン数
const MOVE_COST        = 1;   // 移動にかかる熱
const MOVES_PER_TURN   = 1;   // 1ターンに移動できる回数
const CLASH_INTERVAL   = 400; // 衝突1レーンごとの間隔(ms)
const CPU_INTERVAL     = 500; // CPUの1手ごとの間隔(ms)
const EFFECT_WAIT      = 650; // 効果発動を見せる時間(ms)
const POPUP_MS         = 800; // 効果名ポップアップの表示時間(ms)
const LONG_PRESS_MS    = 500; // 長押し判定(ms)
const LOG_LINES        = 5;   // 表示するログ行数
const LANE_NAMES       = ['左', '中', '右'];

/* =========================================================
   カードデータ
   copies: デッキに入れる枚数(0 = 定義のみ)
   text  : カード上に表示する短い効果テキスト
   desc  : 長押し詳細で表示する説明文
   effect: タイミング別フックとフラグ(不要なカードはnull)
     フック
       onPlace(state, unit)               … 場に出したとき
       onCollideAfter(state, unit)        … 自分が衝突した後(衝突を起こした側のみ)
       onDestroyEnemy(state, unit, enemy) … 自分のダメージで敵を破壊したとき
       getAttackModifier(state, unit, target)
         … 盤上にいる unit(この効果の持ち主)が、target の攻撃値に加える補正を返す。
           攻撃値 = 基本攻撃 + 盤上の全ユニットの補正の合計(0未満にはならない)
     フラグ
       firstStrike  … 先制(先にダメージを与え、倒せば反撃を受けない)
       ignoreDeploy … 着陣中でも衝突できる
       freeMove     … 熱0で移動でき、1ターン1回の回数に数えない
       numbOnHit    … ダメージを与えて生き残った敵を「しびれ」にする
   ========================================================= */
const CARDS = [
  { id: 'homurabion',  name: 'ホムラビオン',   cost: 1, atk: 1, hp: 2, copies: 2, color: '#ff6a2e',
    text: '本気モードになると攻撃+2',
    desc: '本気モードになると攻撃+2。',
    effect: null },
  { id: 'hinokorou',   name: 'ヒノコロウ',     cost: 1, atk: 2, hp: 1, copies: 2, color: '#ff3b3b',
    text: '速攻役',
    desc: '速攻役。熱1で攻撃2を出せるが、体力は1しかない。特別な効果はない。',
    effect: null },
  { id: 'kiramedaka',  name: 'キラメダカ',     cost: 2, atk: 1, hp: 3, copies: 2, color: '#ffe14a',
    text: '場に出したときカードを1枚引く',
    desc: '場に出したとき、カードを1枚引く(山札が0枚なら引かない)。',
    effect: {
      onPlace(state, unit) {
        popup(unit, 'キラッ!1枚ドロー');
        if (draw(unit.side, true)) addLog('キラメダカの登場!カードを1枚引いた', 'fx');
        else addLog('キラメダカの登場!…山札が無くて引けない', 'fx');
      },
    } },
  { id: 'awagamet',    name: 'アワガメット',   cost: 2, atk: 0, hp: 5, copies: 2, color: '#4ad2ff',
    text: '壁役',
    desc: '壁役。攻撃は0だが体力5で敵の攻撃を受け止める。特別な効果はない。',
    effect: null },
  { id: 'borukitsune', name: 'ボルキツネ',     cost: 3, atk: 2, hp: 3, copies: 2, color: '#ffc02e',
    text: '衝突時、隣レーンの敵にも1ダメージ',
    desc: '自分が衝突した後、左右の隣レーンにいる敵ユニットそれぞれに1ダメージ。向かいが空でも発動する。',
    effect: {
      onCollideAfter(state, unit) {
        const foes = adjacentLanes(unit.lane)
          .map(l => P(opp(unit.side)).lanes[l])
          .filter(e => e && e.hp > 0);
        if (!foes.length) return;
        popup(unit, 'パチッ!隣に1ダメージ');
        foes.forEach(e => dealDamage(e, 1, unit));
        addLog(`ボルキツネのパチッ!${foes.map(e => e.name).join('と')}に1ダメージ`, 'fx');
      },
    } },
  { id: 'sabakuroko',  name: 'サバクロコ',     cost: 3, atk: 3, hp: 3, copies: 1, color: '#c8a050',
    text: '衝突で生き残るとごきげん+2',
    desc: '衝突で生き残るとごきげん+2。',
    effect: null },
  { id: 'nokufukurou', name: 'ノクフクロウ',   cost: 3, atk: 2, hp: 2, copies: 1, color: '#9a6aff',
    text: '移動に熱を使わない',
    desc: '熱0で移動できる。この移動は「1ターン1回」の回数に数えない(ノクフクロウ自身の移動は1ターン1回まで)。',
    effect: { freeMove: true } },
  { id: 'shizukurake', name: 'シズクラーケ',   cost: 4, atk: 2, hp: 4, copies: 1, color: '#3a7cff',
    text: '向かいの敵の攻撃-1',
    desc: '向かいにいる敵ユニットの攻撃を-1する(0未満にはならない)。場にいる限り常に有効。',
    effect: {
      popupText: 'ジワッ!攻撃-1',
      getAttackModifier(state, unit, target) {
        return (target.side !== unit.side && target.lane === unit.lane) ? -1 : 0;
      },
    } },
  { id: 'benomukade',  name: 'ベノムカデ',     cost: 4, atk: 2, hp: 4, copies: 1, color: '#a0ff3a',
    text: 'ダメージを与えた敵は次の衝突で攻撃できない',
    desc: 'ベノムカデのダメージを受けて生き残った敵は「しびれ」になり、次の自分のターンの衝突を1回スキップする(ダメージもゲージ押しもしない)。防御側としての反撃は通常どおり行う。',
    effect: { numbOnHit: true } },
  { id: 'tsurarapto',  name: 'ツララプトル',   cost: 5, atk: 4, hp: 4, copies: 1, color: '#9af0ff',
    text: '出したターンから衝突に参加できる',
    desc: '着陣中でも、出したターンから衝突に参加できる。',
    effect: { ignoreDeploy: true } },
  { id: 'ikazuchita',  name: 'イカヅチーター', cost: 5, atk: 5, hp: 3, copies: 1, color: '#fff04a',
    text: '衝突で必ず先に攻撃する',
    desc: '⚡先制:向かいの敵と衝突するとき、攻撃側・防御側どちらでも先にダメージを与える。それで敵を破壊したら自分はダメージを受けない。両方が先制なら通常どおり同時。',
    effect: { firstStrike: true } },
  { id: 'yukihyouga',  name: 'ユキヒョウガ',   cost: 6, atk: 4, hp: 6, copies: 1, color: '#d8f4ff',
    text: '敵を倒すたびにゲージを1押す',
    desc: '自分のダメージで敵を破壊するたびに、ゲージを相手側に1押す(攻撃側・防御側どちらで倒しても発動)。',
    effect: {
      onDestroyEnemy(state, unit, enemy) {
        popup(unit, 'ガオッ!ゲージを1押す');
        pushGaugeFor(unit.side, 1);
        addLog(`ユキヒョウガが${enemy.name}を倒した!ゲージを1押した`, 'fx');
      },
    } },
  { id: 'gotsuinodon', name: 'ゴツイノドン',   cost: 6, atk: 3, hp: 8, copies: 1, color: '#a08060',
    text: '場に出したときゲージを1押す',
    desc: '場に出したとき、ゲージを相手側に1押す。',
    effect: {
      onPlace(state, unit) {
        popup(unit, 'ドスン!ゲージを1押す');
        pushGaugeFor(unit.side, 1);
        addLog('ゴツイノドンの登場!ゲージを1押した', 'fx');
      },
    } },
  { id: 'tenkujira',   name: 'テンクウジラ',   cost: 7, atk: 5, hp: 8, copies: 1, color: '#6ab0ff',
    text: '場に出したとき敵全員に1ダメージ',
    desc: '場に出したとき、敵ユニット全員に1ダメージ。',
    effect: {
      onPlace(state, unit) {
        popup(unit, 'ザブーン!敵全員に1ダメージ');
        P(opp(unit.side)).lanes.forEach(e => { if (e && e.hp > 0) dealDamage(e, 1, unit); });
        addLog('テンクウジラの登場!敵全員に1ダメージ', 'fx');
      },
    } },
  { id: 'hikaryuga',   name: 'ヒカリュウガ',   cost: 7, atk: 6, hp: 6, copies: 1, color: '#fff8c0',
    text: '本気モード中、衝突のたびにゲージを2押す',
    desc: '本気モード中、衝突のたびにゲージを2押す。',
    effect: null },
];
const CARD_MAP = Object.fromEntries(CARDS.map(c => [c.id, c]));

/* =========================================================
   ゲーム状態(1つのstateオブジェクトで管理)
   ========================================================= */
let state = null;

/** プレイヤー1人分の初期データを作る(side: 'p'=プレイヤー / 'c'=CPU) */
function createPlayer(side) {
  return {
    side,
    deck: [],          // カードIDの配列(末尾が山札の上)
    hand: [],          // カードIDの配列
    lanes: Array(LANE_COUNT).fill(null), // ユニット or null
    heatMax: 0,        // 今ターンの熱の最大値
    heatBase: 0,       // 残り熱(通常分)
    heatExtra: 0,      // 残り熱(持ち越し・後攻ボーナス分)
    carry: 0,          // 次ターンへ持ち越す熱
    turn: 0,           // 自分のターン数
    movesUsed: 0,      // このターンに使った移動回数(freeMoveは数えない)
  };
}

/* =========================================================
   ユーティリティ
   ========================================================= */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const P = side => state.players[side];
const opp = side => (side === 'p' ? 'c' : 'p');
const sideName = side => (side === 'p' ? 'あなた' : 'CPU');
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const heatTotal = pl => pl.heatBase + pl.heatExtra;
const isOver = () => state.phase === 'over';

/** 隣のレーン番号(左→右の順) */
function adjacentLanes(lane) {
  return [lane - 1, lane + 1].filter(l => l >= 0 && l < LANE_COUNT);
}

/** 盤上の生きているユニット一覧(左レーンから順、同じレーンはプレイヤー→CPU) */
function boardUnits() {
  const list = [];
  for (let l = 0; l < LANE_COUNT; l++) {
    ['p', 'c'].forEach(s => { const u = P(s).lanes[l]; if (u && u.hp > 0) list.push(u); });
  }
  return list;
}

/** 配列をシャッフル(Fisher-Yates) */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/** CARDSのcopiesからデッキ(20枚)を組み立てる */
function buildDeck() {
  const deck = [];
  CARDS.forEach(c => { for (let i = 0; i < c.copies; i++) deck.push(c.id); });
  if (deck.length !== DECK_SIZE) console.warn('デッキ枚数が' + DECK_SIZE + '枚ではありません: ' + deck.length);
  return shuffle(deck);
}

/** バトルログに1行追加(cls: 'p' | 'c' | 'sys' | 'fx' | '') */
function addLog(text, cls = '') {
  state.log.push({ text, cls });
  if (state.log.length > 60) state.log.shift();
}

/** 画面中央下に短いメッセージを出す */
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1400);
}

/* =========================================================
   効果まわりの共通処理
   ========================================================= */

/** ユニットのカード効果オブジェクト(無ければnull) */
const effectOf = unit => CARD_MAP[unit.id].effect;

/** フラグを持っているか */
function hasFlag(unit, flag) {
  const e = effectOf(unit);
  return !!(e && e[flag]);
}

/** フックを持っているか */
function hasHook(unit, hook) {
  const e = effectOf(unit);
  return !!(e && typeof e[hook] === 'function');
}

/** 攻撃値を計算(盤上の getAttackModifier を合計。0未満にはしない)
 *  extra: まだ盤上にいない仮ユニット(CPUの配置予測用) */
function effAtk(unit, target = null, extra = []) {
  let v = unit.atk;
  boardUnits().concat(extra).forEach(src => {
    if (hasHook(src, 'getAttackModifier')) v += effectOf(src).getAttackModifier(state, src, unit, target);
  });
  return Math.max(0, v);
}

/** 向かいにいる敵ユニット(いなければnull) */
function facing(unit) {
  const e = P(opp(unit.side)).lanes[unit.lane];
  return e && e.hp > 0 ? e : null;
}

/** ユニットの上に効果名をポップアップ表示(レーン単位で保持するので破壊されても見える) */
function popup(unit, text) {
  state.popups.push({ side: unit.side, lane: unit.lane, text, t: Date.now() });
}

/** ダメージを与える。破壊されたら倒した相手(killedBy)を記録 */
function dealDamage(target, amount, source) {
  if (!target || amount <= 0 || target.hp <= 0) return 0;
  target.hp -= amount;
  target.hitAt = Date.now();
  if (target.hp <= 0 && !target.killedBy) target.killedBy = source || null;
  return amount;
}

/** side 側から見て相手側へゲージを押す */
function pushGaugeFor(side, n) {
  pushGauge(side === 'p' ? n : -n);
}

/** ベノムカデ等:ダメージを与えて生き残った敵をしびれさせる */
function applyNumb(src, tgt, dmg) {
  if (dmg > 0 && hasFlag(src, 'numbOnHit') && tgt.hp > 0) {
    tgt.numb = true;
    popup(tgt, 'ビリビリ!しびれ');
    addLog(`${src.name}の毒!${tgt.name}はしびれた`, 'fx');
  }
}

/** 攻撃ダウン効果(シズクラーケ等)が効いていればポップアップ */
function showAttackDown(unit, target) {
  boardUnits().forEach(src => {
    if (!hasHook(src, 'getAttackModifier')) return;
    const m = effectOf(src).getAttackModifier(state, src, unit, target);
    if (m < 0) popup(src, effectOf(src).popupText || `攻撃${m}`);
  });
}

/** 体力0以下のユニットを左レーンから順に破壊し、onDestroyEnemy を処理する。
 *  pair: 衝突した2体(両方破壊なら「相打ち」と記録) */
async function settleDeaths(pair = null) {
  const gid = state.gameId;
  for (let loop = 0; loop < 10; loop++) {
    const dead = [];
    for (let l = 0; l < LANE_COUNT; l++) {
      ['p', 'c'].forEach(s => { const u = P(s).lanes[l]; if (u && u.hp <= 0) dead.push(u); });
    }
    if (!dead.length) return;
    dead.forEach(u => { u.dying = true; });
    render();
    await sleep(380);
    if (gid !== state.gameId) return;
    dead.forEach(u => {
      const pl = P(u.side);
      if (pl.lanes[u.lane] === u) pl.lanes[u.lane] = null;
    });
    if (pair && pair.length === 2 && pair.every(u => dead.includes(u))) {
      addLog(`相打ち!${pair[0].name}と${pair[1].name}は破壊された`, 'sys');
      dead.filter(u => !pair.includes(u)).forEach(u => addLog(`${u.name}は破壊された`, opp(u.side)));
    } else {
      dead.forEach(u => addLog(`${u.name}は破壊された`, opp(u.side)));
    }
    pair = null;
    render();
    // 倒した側の onDestroyEnemy(左レーンから順)
    for (const u of dead) {
      const k = u.killedBy;
      if (k && k.side !== u.side && hasHook(k, 'onDestroyEnemy')) {
        effectOf(k).onDestroyEnemy(state, k, u);
        render();
        await sleep(EFFECT_WAIT);
        if (gid !== state.gameId) return;
        if (checkWin()) return;
      }
    }
  }
}

/** 効果フックを呼び、見せる時間を取り、破壊・勝敗判定まで処理する */
async function runHook(unit, hook) {
  if (!hasHook(unit, hook)) return;
  const gid = state.gameId;
  effectOf(unit)[hook](state, unit);
  render();
  await sleep(EFFECT_WAIT);
  if (gid !== state.gameId) return;
  if (checkWin()) return;
  await settleDeaths();
}

/* =========================================================
   ゲーム進行
   ========================================================= */

/** 新しい試合を開始する(デッキ作成・初期手札・先攻後攻決定) */
function newGame() {
  const gameId = state ? state.gameId + 1 : 1;
  state = {
    gameId,                 // 再戦時に古い非同期処理を止めるためのID
    phase: 'mulligan',      // mulligan | main | effect | cpu | clash | discard | over
    mulliganUsed: false,
    first: Math.random() < 0.5 ? 'p' : 'c',
    turnSide: null,
    gauge: 0,
    selected: null,         // 選択中の手札インデックス
    moveSel: null,          // 移動元に選んだ自分のレーン
    discardSel: null,       // 捨てる候補の手札インデックス
    activeLane: null,       // 衝突処理中のレーン
    popups: [],             // 効果名ポップアップ
    detail: null,           // 長押し詳細 {id, uid}
    log: [],
    result: null,
    uid: 0,
    players: { p: createPlayer('p'), c: createPlayer('c') },
  };
  gaugeVis = 0;
  ['p', 'c'].forEach(side => {
    const pl = P(side);
    pl.deck = buildDeck();
    for (let i = 0; i < START_HAND; i++) draw(side, true);
  });
  addLog(`試合開始!${sideName(state.first)}が先攻`, 'sys');
  render();
}

/** 引き直し(手札を全部デッキに戻してシャッフルし、4枚引き直す) */
function mulligan() {
  if (state.phase !== 'mulligan' || state.mulliganUsed) return;
  const pl = P('p');
  pl.deck.push(...pl.hand);
  pl.hand = [];
  shuffle(pl.deck);
  for (let i = 0; i < START_HAND; i++) draw('p', true);
  state.mulliganUsed = true;
  addLog('あなたは手札を引き直した', 'p');
  render();
}

/** 引き直し確認を終えて最初のターンを始める */
function beginMatch() {
  if (state.phase !== 'mulligan') return;
  startTurn(state.first);
}

/** 1枚ドロー(デッキが0枚なら引かない) */
function draw(side, silent = false) {
  const pl = P(side);
  if (pl.deck.length === 0) {
    if (!silent) addLog(`${sideName(side)}の山札が無いので引けない`, side);
    return false;
  }
  pl.hand.push(pl.deck.pop());
  return true;
}

/** ターン開始:熱の最大値決定→熱回復(+持ち越し)→1枚ドロー */
async function startTurn(side) {
  state.turnSide = side;
  state.selected = null;
  state.moveSel = null;
  state.discardSel = null;
  const pl = P(side);
  pl.turn++;
  pl.movesUsed = 0;
  pl.heatMax = Math.min(HEAT_START + (pl.turn - 1), HEAT_CAP);
  pl.heatBase = pl.heatMax;
  const bonus = (side !== state.first && pl.turn === 1) ? SECOND_BONUS : 0;
  pl.heatExtra = pl.carry + bonus;
  pl.carry = 0;
  // 前のターンに置いたユニットの「着陣中」を解除
  pl.lanes.forEach(u => { if (u) u.sick = false; });
  addLog(`── ${sideName(side)}のターン ${pl.turn}/${TURNS_PER_PLAYER} ──`, 'sys');
  draw(side);

  if (side === 'p') {
    state.phase = 'main';
    render();
  } else {
    state.phase = 'cpu';
    render();
    await cpuTurn();
  }
}

/** 熱を支払う(持ち越し・ボーナス分から先に使う) */
function spendHeat(pl, cost) {
  const fromExtra = Math.min(pl.heatExtra, cost);
  pl.heatExtra -= fromExtra;
  pl.heatBase -= (cost - fromExtra);
}

/** 手札のユニットをレーンに配置する(onPlace効果も処理)。成功したらtrue */
async function placeUnit(side, handIdx, lane) {
  const gid = state.gameId;
  const pl = P(side);
  const id = pl.hand[handIdx];
  if (id === undefined || pl.lanes[lane]) return false;
  const card = CARD_MAP[id];
  if (card.cost > heatTotal(pl)) return false;
  spendHeat(pl, card.cost);
  pl.hand.splice(handIdx, 1);
  const unit = {
    uid: ++state.uid, id: card.id, name: card.name,
    atk: card.atk, hp: card.hp, maxHp: card.hp,
    side, lane,
    sick: true,        // 着陣中(このターンは衝突しない。ignoreDeployは例外)
    numb: false,       // しびれ(次の自分の衝突を1回スキップ)
    movedTurn: 0,      // 最後に移動した自分のターン番号(freeMove用)
    hitAt: 0, dying: false, justPlaced: true, killedBy: null,
  };
  pl.lanes[lane] = unit;
  addLog(`${sideName(side)}は${card.name}を${LANE_NAMES[lane]}レーンに置いた`, side);
  render();
  if (hasHook(unit, 'onPlace')) {
    await sleep(250);
    if (gid !== state.gameId) return true;
    await runHook(unit, 'onPlace');
  }
  return true;
}

/* ---------- 移動 ---------- */

/** ユニットが移動できるか調べる。{ok, reason, cost, free, targets} */
function moveInfo(unit) {
  const pl = P(unit.side);
  const free = hasFlag(unit, 'freeMove');
  const targets = adjacentLanes(unit.lane).filter(l => !pl.lanes[l]);
  let reason = null;
  if (free) {
    if (unit.movedTurn === pl.turn) reason = 'このユニットはもう移動した';
  } else if (pl.movesUsed >= MOVES_PER_TURN) {
    reason = '移動済み(1ターン1回まで)';
  } else if (heatTotal(pl) < MOVE_COST) {
    reason = `熱が足りない(移動は熱${MOVE_COST})`;
  }
  if (!reason && !targets.length) reason = '隣に空いているレーンがない';
  return { ok: !reason, reason, cost: free ? 0 : MOVE_COST, free, targets: reason ? [] : targets };
}

/** ユニットを隣の空きレーンへ移動する。成功したらtrue */
function moveUnit(side, from, to) {
  const pl = P(side);
  const u = pl.lanes[from];
  if (!u) return false;
  const info = moveInfo(u);
  if (!info.ok || !info.targets.includes(to)) return false;
  spendHeat(pl, info.cost);
  pl.lanes[from] = null;
  pl.lanes[to] = u;
  u.lane = to;
  u.movedTurn = pl.turn;
  if (info.free) {
    popup(u, 'スイッ!無料移動');
    addLog(`${u.name}は${LANE_NAMES[from]}→${LANE_NAMES[to]}へ移動(熱0)`, side);
  } else {
    pl.movesUsed++;
    addLog(`${u.name}は${LANE_NAMES[from]}→${LANE_NAMES[to]}へ移動(熱${info.cost})`, side);
  }
  return true;
}

/* ---------- ゲージ・勝敗 ---------- */

/** ゲージを動かす(+はプレイヤー側、-はCPU側) */
function pushGauge(amount) {
  state.gauge = Math.max(-GAUGE_MAX, Math.min(GAUGE_MAX, state.gauge + amount));
  animateGauge();
}

/** 勝敗判定(ゲージ±8)。決着したらtrue */
function checkWin() {
  if (isOver()) return true;
  if (state.gauge >= GAUGE_MAX) { endGame('p', 'ゲージを押し切った!'); return true; }
  if (state.gauge <= -GAUGE_MAX) { endGame('c', 'ゲージを押し切られた…'); return true; }
  return false;
}

/** 8ターンずつ終了時の判定 */
function judgeByGauge() {
  const g = state.gauge;
  const reason = `${TURNS_PER_PLAYER}ターン終了・ゲージ ${g > 0 ? '+' : ''}${g}`;
  if (g > 0) endGame('p', reason);
  else if (g < 0) endGame('c', reason);
  else endGame('draw', reason);
}

/** 試合終了 */
function endGame(winner, reason) {
  state.phase = 'over';
  state.activeLane = null;
  state.selected = null;
  state.moveSel = null;
  state.result = { winner, reason };
  addLog(winner === 'draw' ? '引き分け!' : `${sideName(winner)}の勝利!`, 'sys');
  render();
}

/* ---------- 衝突 ---------- */

/** 1レーン分の衝突処理(ターンプレイヤーのユニットだけが衝突を起こす) */
async function resolveClash(side, lane) {
  const gid = state.gameId;
  const me = P(side), op = P(opp(side));
  const a = me.lanes[lane];
  if (!a) return;
  if (a.sick && !hasFlag(a, 'ignoreDeploy')) return; // 着陣中は衝突しない

  state.activeLane = lane;
  render();
  await sleep(150);
  if (gid !== state.gameId) return;

  // しびれ:この衝突をスキップしてしびれ解除
  if (a.numb) {
    a.numb = false;
    popup(a, 'しびれて動けない…');
    addLog(`${a.name}はしびれて衝突できない`, 'fx');
    render();
    await sleep(CLASH_INTERVAL + 250);
    if (gid !== state.gameId) return;
    state.activeLane = null;
    render();
    return;
  }
  if (a.sick) popup(a, 'ヒュオッ!即参戦');

  const d = op.lanes[lane];
  if (d) {
    // 向かいに敵がいる:攻撃値ぶんのダメージを与え合う
    const atkA = effAtk(a, d), atkD = effAtk(d, a);
    showAttackDown(a, d);
    showAttackDown(d, a);
    const fa = hasFlag(a, 'firstStrike'), fd = hasFlag(d, 'firstStrike');
    let toD = 0, toA = 0;
    if (fa && !fd) {
      popup(a, '⚡先制攻撃!');
      toD = dealDamage(d, atkA, a);
      if (d.hp > 0) toA = dealDamage(a, atkD, d);
    } else if (fd && !fa) {
      popup(d, '⚡先制攻撃!');
      toA = dealDamage(a, atkD, d);
      if (a.hp > 0) toD = dealDamage(d, atkA, a);
    } else {
      toD = dealDamage(d, atkA, a);
      toA = dealDamage(a, atkD, d);
    }
    addLog(`${a.name}と${d.name}が衝突!(${toD}/${toA}ダメージ)`, side);
    if (fa && !fd && d.hp <= 0) addLog(`⚡${a.name}の先制!反撃を受けなかった`, 'fx');
    if (fd && !fa && a.hp <= 0) addLog(`⚡${d.name}の先制!反撃を受けなかった`, 'fx');
    applyNumb(a, d, toD);
    applyNumb(d, a, toA);
    render();
    await sleep(CLASH_INTERVAL);
    if (gid !== state.gameId) return;
  } else {
    // 向かいが空:攻撃値ぶんゲージを相手側へ押す
    const atk = effAtk(a, null);
    pushGaugeFor(side, atk);
    addLog(`${a.name}がゲージを${atk}押した`, side);
    render();
    await sleep(CLASH_INTERVAL);
    if (gid !== state.gameId) return;
    if (checkWin()) return;
  }

  // 衝突後の効果(ボルキツネ等)
  if (hasHook(a, 'onCollideAfter')) {
    effectOf(a).onCollideAfter(state, a);
    render();
    await sleep(EFFECT_WAIT);
    if (gid !== state.gameId) return;
    if (checkWin()) return;
  }

  await settleDeaths(d ? [a, d] : null);
  if (gid !== state.gameId || isOver()) return;
  state.activeLane = null;
  render();
  checkWin();
}

/** ターン終了処理:衝突→手札上限→熱持ち越し→相手のターンへ */
async function endTurn(side) {
  const gid = state.gameId;
  state.phase = 'clash';
  state.selected = null;
  state.moveSel = null;
  render();
  const pl = P(side);

  // 衝突(先攻の1ターン目は衝突しない)
  if (side === state.first && pl.turn === 1) {
    addLog('先攻1ターン目は衝突なし', 'sys');
    render();
    await sleep(300);
  } else {
    for (let lane = 0; lane < LANE_COUNT; lane++) {
      await resolveClash(side, lane);
      if (gid !== state.gameId || isOver()) return;
    }
  }
  state.activeLane = null;

  // 手札上限チェック
  if (pl.hand.length > HAND_MAX) {
    if (side === 'p') {
      state.phase = 'discard';
      state.discardSel = null;
      render();
      await new Promise(resolve => { discardResolver = resolve; });
      if (gid !== state.gameId) return;
    } else {
      cpuDiscard();
    }
  }

  // 熱の持ち越し(最大2)
  pl.carry = Math.min(heatTotal(pl), CARRY_MAX);

  // 8ターンずつ終了で判定
  if (P('p').turn >= TURNS_PER_PLAYER && P('c').turn >= TURNS_PER_PLAYER) {
    judgeByGauge();
    return;
  }
  render();
  await sleep(350);
  if (gid !== state.gameId) return;
  startTurn(opp(side));
}

/* ---------- 手札を捨てる処理 ---------- */
let discardResolver = null;

/** プレイヤーが選んだカードを捨てる */
function confirmDiscard() {
  if (state.phase !== 'discard' || state.discardSel === null) return;
  const pl = P('p');
  const [id] = pl.hand.splice(state.discardSel, 1);
  addLog(`あなたは${CARD_MAP[id].name}を捨てた`, 'p');
  state.discardSel = null;
  if (pl.hand.length <= HAND_MAX) {
    state.phase = 'clash'; // 次ターンへ進むまで操作不可
    render();
    const r = discardResolver; discardResolver = null;
    if (r) r();
  } else {
    render();
  }
}

/** CPUは一番コストが低いカードから捨てる */
function cpuDiscard() {
  const pl = P('c');
  while (pl.hand.length > HAND_MAX) {
    let minIdx = 0;
    pl.hand.forEach((id, i) => { if (CARD_MAP[id].cost < CARD_MAP[pl.hand[minIdx]].cost) minIdx = i; });
    const [id] = pl.hand.splice(minIdx, 1);
    addLog(`CPUは${CARD_MAP[id].name}を捨てた`, 'c');
  }
}

/* =========================================================
   CPU(STEP2:高コスト優先+簡単なレーン選び)
   ========================================================= */
/** 置くレーンを選ぶ:相打ち以上が取れるレーン > 向かいが空のレーン > ランダム */
function cpuChooseLane(id, empty) {
  const card = CARD_MAP[id];
  const foes = P('p').lanes;
  const good = [], open = [];
  empty.forEach(i => {
    const e = foes[i];
    if (e) {
      const tmp = { id, name: card.name, atk: card.atk, hp: card.hp, side: 'c', lane: i };
      if (effAtk(tmp, e, [tmp]) >= e.hp) good.push(i);
    } else {
      open.push(i);
    }
  });
  return pick(good.length ? good : open.length ? open : empty);
}

/** 熱の範囲内で、コストの高いユニットから順に置けるだけ置く */
async function cpuTurn() {
  const gid = state.gameId;
  const pl = P('c');
  await sleep(CPU_INTERVAL);
  while (gid === state.gameId && !isOver()) {
    const empty = [];
    for (let i = 0; i < LANE_COUNT; i++) if (!pl.lanes[i]) empty.push(i);
    const heat = heatTotal(pl);
    const cands = shuffle(pl.hand.map((id, idx) => ({ id, idx, cost: CARD_MAP[id].cost })))
      .filter(x => x.cost <= heat)
      .sort((a, b) => b.cost - a.cost);
    if (!empty.length || !cands.length) break;
    const c = cands[0];
    await placeUnit('c', c.idx, cpuChooseLane(c.id, empty));
    if (gid !== state.gameId || isOver()) return;
    render();
    await sleep(CPU_INTERVAL);
  }
  if (gid !== state.gameId || isOver()) return;
  await endTurn('c');
}

/* =========================================================
   ゲージのアニメーション(render()でDOMが作り直されても滑らかに動かす)
   ========================================================= */
let gaugeVis = 0;      // 画面上に表示しているゲージ位置(小数)
let gaugeTween = null; // {from, to, start, dur}

const gaugePct = v => ((v + GAUGE_MAX) / (GAUGE_MAX * 2)) * 100;

/** ゲージ表示を現在値へ向けてアニメーションさせる */
function animateGauge() {
  gaugeTween = { from: gaugeVis, to: state.gauge, start: performance.now(), dur: 450 };
  requestAnimationFrame(gaugeStep);
}
function gaugeStep(now) {
  if (!gaugeTween) return;
  const t = Math.max(0, Math.min(1, (now - gaugeTween.start) / gaugeTween.dur));
  const e = 1 - Math.pow(1 - t, 3);
  gaugeVis = gaugeTween.from + (gaugeTween.to - gaugeTween.from) * e;
  applyGaugeDom();
  if (t < 1) requestAnimationFrame(gaugeStep);
  else gaugeTween = null;
}
/** ゲージのマーカー・塗りを現在の表示値で更新 */
function applyGaugeDom() {
  const marker = document.getElementById('g-marker');
  const fill = document.getElementById('g-fill');
  if (!marker || !fill) return;
  const v = gaugeVis;
  marker.style.left = gaugePct(v) + '%';
  if (v >= 0) { fill.className = 'g-fill p'; fill.style.left = '50%'; fill.style.width = (gaugePct(v) - 50) + '%'; }
  else { fill.className = 'g-fill c'; fill.style.left = gaugePct(v) + '%'; fill.style.width = (50 - gaugePct(v)) + '%'; }
}

/* =========================================================
   描画(毎回画面を作り直す)
   ========================================================= */
const root = document.getElementById('app');

/** 画面全体を描画する */
function render() {
  // 手札の横スクロール位置を保持
  const handEl = root.querySelector('.hand');
  const scroll = handEl ? handEl.scrollLeft : 0;
  // 期限切れのポップアップを捨てる
  const now = Date.now();
  state.popups = state.popups.filter(p => now - p.t < POPUP_MS);

  root.innerHTML =
    renderOppBar() +
    renderRow('c') +
    renderGauge() +
    renderRow('p') +
    renderMyBar() +
    renderHand() +
    renderControls() +
    renderLog() +
    renderModal() +
    renderDetail();

  const newHand = root.querySelector('.hand');
  if (newHand) newHand.scrollLeft = scroll;
  applyGaugeDom();

  // 一度だけ再生するアニメーションのフラグを下ろす
  ['p', 'c'].forEach(s => P(s).lanes.forEach(u => { if (u) u.justPlaced = false; }));
}

/** 相手情報バー */
function renderOppBar() {
  const c = P('c');
  const active = state.turnSide === 'c' && state.phase !== 'over' && state.phase !== 'mulligan';
  return `<div class="bar opp ${active ? 'active' : ''}">
    <span class="who">CPU</span>
    <span class="stat heatnum">熱 <b>${c.heatBase}</b>${c.heatExtra > 0 ? `<span class="cx">+${c.heatExtra}</span>` : ''}/${c.heatMax}</span>
    <span class="stat">手札 <b>${c.hand.length}</b></span>
    <span class="stat">山札 <b>${c.deck.length}</b></span>
    <span class="stat">${c.turn}/${TURNS_PER_PLAYER}</span>
  </div>`;
}

/** 移動元に選んでいるユニットの移動情報(無ければnull) */
function currentMoveInfo() {
  if (state.moveSel === null) return null;
  const u = P('p').lanes[state.moveSel];
  return u ? moveInfo(u) : null;
}

/** レーン行(side: 'c'=相手, 'p'=自分) */
function renderRow(side) {
  const pl = P(side);
  const selCard = state.selected !== null ? CARD_MAP[P('p').hand[state.selected]] : null;
  const mv = side === 'p' && state.phase === 'main' ? currentMoveInfo() : null;
  const now = Date.now();
  let html = `<div class="row">`;
  for (let i = 0; i < LANE_COUNT; i++) {
    const u = pl.lanes[i];
    const can = side === 'p' && state.phase === 'main' && selCard && !u && selCard.cost <= heatTotal(P('p'));
    const canMove = mv && mv.targets.includes(i);
    const active = state.activeLane === i ? 'active' : '';
    const attrs = side === 'p' ? `data-act="lane" data-i="${i}"` : '';
    html += `<div class="cell ${can ? 'can' : ''} ${canMove ? 'can-move' : ''} ${active}" ${attrs}>`;
    if (u) html += renderUnit(u);
    else if (canMove) html += `<span class="empty">ここへ移動</span>`;
    else html += `<span class="empty">${can ? 'ここに置く' : LANE_NAMES[i] + ' 空き'}</span>`;
    // 効果名ポップアップ
    state.popups.filter(p => p.side === side && p.lane === i).forEach((p, k) => {
      html += `<div class="popup" style="top:${6 + k * 24}px;animation-delay:-${now - p.t}ms">${p.text}</div>`;
    });
    html += `</div>`;
  }
  return html + `</div>`;
}

/** マス内のユニット表示 */
function renderUnit(u) {
  const card = CARD_MAP[u.id];
  const cls = ['unit', 'side-' + u.side];
  if (u.sick && !hasFlag(u, 'ignoreDeploy')) cls.push('sick');
  if (u.dying) cls.push('dying');
  if (u.justPlaced) cls.push('placed');
  if (u.side === 'p' && state.moveSel === u.lane) cls.push('msel');
  const atk = effAtk(u, facing(u));
  const hpCls = ['hp'];
  let hpStyle = '';
  if (u.hp < u.maxHp) hpCls.push('dmg');
  const since = Date.now() - u.hitAt;
  if (since < 600) { hpCls.push('hit'); hpStyle = `style="animation-delay:-${since}ms"`; }
  const tags = [];
  if (u.numb) tags.push('<span class="u-numb">しびれ</span>');
  if (u.sick) tags.push(hasFlag(u, 'ignoreDeploy') ? '<span class="u-sick go">即参戦</span>' : '<span class="u-sick">着陣中</span>');
  const act = u.side === 'p' ? `data-act="unit" data-i="${u.lane}"` : '';
  return `<div class="${cls.join(' ')}" style="--uc:${card.color}" ${act} data-detail="${u.id}" data-uid="${u.uid}">
    <span class="u-cost">${card.cost}</span>
    ${hasFlag(u, 'firstStrike') ? '<span class="u-fs">⚡</span>' : ''}
    <div class="u-name">${u.name}</div>
    <div class="u-stats"><span class="atk ${atk < u.atk ? 'down' : ''}">⚔${atk}</span><span class="${hpCls.join(' ')}" ${hpStyle}>♥${Math.max(0, u.hp)}</span></div>
    ${tags.length ? `<div class="tags">${tags.join('')}</div>` : '<div class="lbl">攻撃 / 体力</div>'}
  </div>`;
}

/** おしあいゲージ */
function renderGauge() {
  let ticks = '';
  for (let v = -GAUGE_MAX + 1; v < GAUGE_MAX; v++) {
    ticks += `<div class="g-tick ${v === 0 ? 'mid' : ''}" style="left:${gaugePct(v)}%"></div>`;
  }
  const g = state.gauge;
  const mCls = g > 0 ? 'p' : g < 0 ? 'c' : '';
  let turnTxt = '', turnCls = '';
  if (state.phase === 'mulligan') turnTxt = '準備中';
  else if (state.phase === 'over') turnTxt = '試合終了';
  else if (state.turnSide === 'p') { turnTxt = state.phase === 'clash' ? 'あなたの衝突!' : 'あなたのターン'; turnCls = 'p'; }
  else { turnTxt = state.phase === 'clash' ? 'CPUの衝突!' : 'CPUのターン'; turnCls = 'c'; }
  return `<div class="gauge">
    <div class="g-top">
      <span class="l">◀ CPU −${GAUGE_MAX}</span>
      <span class="turn ${turnCls}">${turnTxt}</span>
      <span class="r">+${GAUGE_MAX} あなた ▶</span>
    </div>
    <div class="g-track">
      ${ticks}
      <div id="g-fill" class="g-fill"></div>
      <div id="g-marker" class="g-marker ${mCls}">${g > 0 ? '+' + g : g}</div>
    </div>
  </div>`;
}

/** 自分の情報バー(熱は通常分と持ち越し分を色分け) */
function renderMyBar() {
  const p = P('p');
  const active = state.turnSide === 'p' && state.phase !== 'over' && state.phase !== 'mulligan';
  let pips = '';
  for (let i = 0; i < p.heatMax; i++) pips += `<span class="pip ${i < p.heatBase ? 'on' : ''}"></span>`;
  // 持ち越し・ボーナス分(最大値を超えた分)は別色
  for (let i = 0; i < Math.max(p.heatExtra, 0); i++) pips += `<span class="pip cx on"></span>`;
  const cx = p.heatExtra > 0 ? `<span class="cx">+${p.heatExtra}</span>` : '';
  return `<div class="bar me ${active ? 'active' : ''}">
    <span class="stat heatnum">熱 <b>${p.heatBase}</b>${cx}/${p.heatMax}<span class="pips">${pips}</span></span>
    <span class="stat">ターン <b>${p.turn}</b>/${TURNS_PER_PLAYER}</span>
    <span class="stat">山札 <b>${p.deck.length}</b></span>
  </div>`;
}

/** カード1枚のHTML(act=null ならタップ動作なし、長押し詳細のみ) */
function renderCard(id, idx, extraCls = '', act = 'card') {
  const c = CARD_MAP[id];
  return `<button class="card ${extraCls}" style="--uc:${c.color}" data-detail="${id}" ${act ? `data-act="${act}" data-i="${idx}"` : ''}>
    <div class="c-head"><span class="c-cost">${c.cost}</span><span class="c-name">${c.name}</span></div>
    <div class="c-stats"><span class="atk">⚔${c.atk}</span><span class="hp">♥${c.hp}</span></div>
    <div class="c-text">${c.text}</div>
  </button>`;
}

/** 手札(横スクロール) */
function renderHand() {
  const p = P('p');
  const heat = heatTotal(p);
  const discarding = state.phase === 'discard';
  let note;
  if (discarding) {
    note = `<div class="hand-note warn"><span>手札が多すぎます!あと${p.hand.length - HAND_MAX}枚捨ててください</span></div>`;
  } else {
    let hint = 'タップで選択・長押しで詳細';
    const mv = state.phase === 'main' ? currentMoveInfo() : null;
    if (mv) {
      hint = mv.ok
        ? `<span class="mv">移動先をタップ(熱${mv.cost}${mv.free ? '・回数消費なし' : ''})</span>`
        : `<span class="ng">移動不可:${mv.reason}</span>`;
    } else if (state.selected !== null) {
      hint = '置くレーンをタップ';
    }
    note = `<div class="hand-note"><span>手札 ${p.hand.length}/${HAND_MAX}</span><span>${hint}</span></div>`;
  }
  let cards = '';
  p.hand.forEach((id, i) => {
    const cls = [];
    if (!discarding && CARD_MAP[id].cost > heat) cls.push('poor');
    if (!discarding && state.selected === i) cls.push('sel');
    if (discarding && state.discardSel === i) cls.push('dsel');
    cards += renderCard(id, i, cls.join(' '));
  });
  if (!cards) cards = '<div class="empty-hand">手札がありません</div>';
  return `<div class="hand-wrap">${note}<div class="hand">${cards}</div></div>`;
}

/** 操作ボタン */
function renderControls() {
  if (state.phase === 'discard') {
    return `<div class="controls">
      <button class="btn danger" data-act="discard" ${state.discardSel === null ? 'disabled' : ''}>
        ${state.discardSel === null ? '捨てるカードを選択' : 'このカードを捨てる'}
      </button></div>`;
  }
  const can = state.phase === 'main';
  let label = 'ターン終了';
  if (state.phase === 'cpu') label = 'CPUが考え中…';
  else if (state.phase === 'clash') label = '衝突中…';
  else if (state.phase === 'effect') label = '効果処理中…';
  return `<div class="controls"><button class="btn" data-act="end" ${can ? '' : 'disabled'}>${label}</button></div>`;
}

/** バトルログ(直近5行) */
function renderLog() {
  const lines = state.log.slice(-LOG_LINES).map(l => `<div class="${l.cls}">${l.text}</div>`).join('');
  return `<div class="log">${lines}</div>`;
}

/** モーダル(引き直し確認/勝敗表示) */
function renderModal() {
  if (state.phase === 'mulligan') {
    const p = P('p');
    const isFirst = state.first === 'p';
    const hand = p.hand.map((id, i) => renderCard(id, i, 'mini', null)).join('');
    const btns = state.mulliganUsed
      ? `<button class="btn" data-act="keep">この手札で開始</button>`
      : `<button class="btn sub" data-act="mull">引き直す</button><button class="btn" data-act="keep">このまま</button>`;
    return `<div class="modal-bg"><div class="modal">
      <h1>オシキリビースト</h1>
      <div class="order ${isFirst ? 'p' : 'c'}">あなたは${isFirst ? '先攻' : '後攻'}です</div>
      <p>${isFirst ? '先攻1ターン目は衝突できません' : '後攻1ターン目は熱+1'}</p>
      <div class="mini-hand">${hand}</div>
      <p>${state.mulliganUsed ? '引き直しました' : '手札を1回だけ引き直せます(長押しで詳細)'}</p>
      <div class="btns">${btns}</div>
    </div></div>`;
  }
  if (state.phase === 'over' && state.result) {
    const w = state.result.winner;
    const title = w === 'p' ? '勝利!' : w === 'c' ? '敗北…' : '引き分け';
    const cls = w === 'p' ? 'win' : w === 'c' ? 'lose' : 'draw';
    return `<div class="modal-bg late"><div class="modal">
      <h2 class="${cls}">${title}</h2>
      <p>${state.result.reason}</p>
      <div class="btns"><button class="btn" data-act="again">もう一度</button></div>
    </div></div>`;
  }
  return '';
}

/** 長押しで開くカード詳細モーダル */
function renderDetail() {
  if (!state.detail) return '';
  const c = CARD_MAP[state.detail.id];
  // 場のユニットなら現在の値と状態も表示
  let u = null;
  if (state.detail.uid) {
    ['p', 'c'].forEach(s => P(s).lanes.forEach(x => { if (x && x.uid === state.detail.uid) u = x; }));
  }
  let stats, owner = '', tags = [];
  if (u) {
    const atk = effAtk(u, facing(u));
    stats = `<span class="atk ${atk < u.atk ? 'down' : ''}">攻撃 ${atk}${atk !== u.atk ? ` <small>(基本${u.atk})</small>` : ''}</span>
             <span class="hp">体力 ${Math.max(0, u.hp)}<small>/${u.maxHp}</small></span>`;
    owner = `${u.side === 'p' ? 'あなた' : 'CPU'}の${LANE_NAMES[u.lane]}レーン`;
    if (u.sick) tags.push(hasFlag(u, 'ignoreDeploy') ? '<span class="d-tag">即参戦</span>' : '<span class="d-tag sick">着陣中</span>');
    if (u.numb) tags.push('<span class="d-tag numb">しびれ(次の衝突をスキップ)</span>');
  } else {
    stats = `<span class="atk">攻撃 ${c.atk}</span><span class="hp">体力 ${c.hp}</span>`;
  }
  if (c.effect && c.effect.firstStrike) tags.push('<span class="d-tag">⚡先制</span>');
  return `<div class="modal-bg top" data-act="closeDetail"><div class="modal detail" style="--uc:${c.color}">
    <div class="d-head"><span class="c-cost">${c.cost}</span>
      <div><div class="d-name">${c.name}</div>${owner ? `<div class="d-owner">${owner}</div>` : ''}</div></div>
    <div class="d-stats">${stats}</div>
    ${tags.length ? `<div class="d-tags">${tags.join('')}</div>` : ''}
    <div class="d-text">${c.desc}</div>
    <div class="btns"><button class="btn sub" data-act="closeDetail">閉じる</button></div>
  </div></div>`;
}

/* =========================================================
   入力処理(タップ・長押し)
   ========================================================= */
let lpTimer = null;       // 長押しタイマー
let lpStart = null;       // 長押し開始位置
let suppressClick = false; // 長押し直後のクリックを無視する

root.addEventListener('pointerdown', e => {
  suppressClick = false;
  const el = e.target.closest('[data-detail]');
  if (!el || state.detail) return;
  const info = { id: el.dataset.detail, uid: el.dataset.uid ? Number(el.dataset.uid) : null };
  lpStart = { x: e.clientX, y: e.clientY };
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => {
    lpTimer = null;
    lpStart = null;
    suppressClick = true;
    state.detail = info;
    if (navigator.vibrate) navigator.vibrate(15);
    render();
  }, LONG_PRESS_MS);
});
root.addEventListener('pointermove', e => {
  if (!lpStart) return;
  if (Math.hypot(e.clientX - lpStart.x, e.clientY - lpStart.y) > 10) cancelLongPress();
});
function cancelLongPress() { clearTimeout(lpTimer); lpTimer = null; lpStart = null; }
root.addEventListener('pointerup', cancelLongPress);
root.addEventListener('pointercancel', cancelLongPress);
root.addEventListener('contextmenu', e => e.preventDefault());

root.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const i = el.dataset.i !== undefined ? Number(el.dataset.i) : null;
  if (state.detail) {
    if (act === 'closeDetail') { state.detail = null; render(); }
    return;
  }
  switch (act) {
    case 'card': onTapCard(i); break;
    case 'lane': onTapLane(i); break;
    case 'unit': onTapUnit(i); break;
    case 'end':  if (state.phase === 'main') endTurn('p'); break;
    case 'discard': confirmDiscard(); break;
    case 'mull': mulligan(); break;
    case 'keep': beginMatch(); break;
    case 'again': newGame(); break;
  }
});

/** 手札カードをタップ:選択/選択解除(捨てる時は捨てる候補を選ぶ) */
function onTapCard(i) {
  if (state.phase === 'discard') {
    state.discardSel = state.discardSel === i ? null : i;
    render();
    return;
  }
  if (state.phase !== 'main') return;
  state.moveSel = null;
  if (state.selected === i) { state.selected = null; render(); return; }
  const card = CARD_MAP[P('p').hand[i]];
  if (card.cost > heatTotal(P('p'))) { showToast('熱が足りません'); render(); return; }
  if (P('p').lanes.every(u => u)) { showToast('空いているレーンがありません'); render(); return; }
  state.selected = i;
  render();
}

/** 自分のユニットをタップ:移動元として選択/選択解除 */
function onTapUnit(lane) {
  if (state.phase !== 'main') return;
  state.selected = null;
  if (state.moveSel === lane) { state.moveSel = null; render(); return; }
  state.moveSel = lane;
  const info = currentMoveInfo();
  if (info && !info.ok) showToast('移動不可:' + info.reason);
  render();
}

/** 自分のレーンをタップ:選択中のカードを配置/選択中のユニットを移動 */
async function onTapLane(lane) {
  if (state.phase !== 'main') return;
  // 移動
  if (state.moveSel !== null) {
    const from = state.moveSel;
    state.moveSel = null;
    const info = moveInfo(P('p').lanes[from]);
    if (info.targets.includes(lane)) moveUnit('p', from, lane);
    render();
    return;
  }
  // 配置
  if (state.selected === null) return;
  if (P('p').lanes[lane]) { showToast('そのレーンは埋まっています'); return; }
  const gid = state.gameId;
  const idx = state.selected;
  state.selected = null;
  state.phase = 'effect';
  await placeUnit('p', idx, lane);
  if (gid !== state.gameId || isOver()) return;
  state.phase = 'main';
  render();
}

/* ===== 起動 ===== */
newGame();
</script>
