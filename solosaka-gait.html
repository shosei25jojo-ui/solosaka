#topbar button {

#start .sub { font-size: 16px; opacity: .8; }
#start .tap { margin-top: 18px; font-size: 22px; font-weight: 700; animation: blink 1.2s infinite; }
#start .hint { font-size: 12px; opacity: .6; max-width: 90%; text-align: center; }
@keyframes blink { 50% { opacity: .35; } }
#rotate {
